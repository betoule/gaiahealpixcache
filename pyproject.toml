[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaiahealpixcache"
version = "0.1.0"
description = "Download and cache a lightweight version of the Gaia catalog for offline work"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Gaia Healpix Cache Contributors" }
]
keywords = ["gaia", "astronomy", "healpix", "catalog", "cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "healpy",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]
dev = [
    "black",
    "pylint",
    "pre-commit",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--cov=gaiahealpixcache --cov-fail-under=90 -m 'not slow'"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0103",  # conventional name violations (allows hPa, etc.)
    "C0415",  # import outside toplevel (lazy imports are intentional)
    "C0206",  # consider iterating with .items() (dict comprehension pattern)
    "W0603",  # global statement (used for lazy module-level caching)
    "W1514",  # unspecified encoding (binary mode, not needed)
    "R0913",  # too many arguments
    "R0917",  # too many positional arguments
    "R0914",  # too many local variables
    "E1101",  # no-member (astropy units are dynamic)
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "ra", "dec", "x", "y", "z", "fn", "fid"]

[project.urls]
Homepage = "https://github.com/gaiahealpixcache/gaiahealpixcache"
Repository = "https://github.com/gaiahealpixcache/gaiahealpixcache"
Issues = "https://github.com/gaiahealpixcache/gaiahealpixcache/issues"
